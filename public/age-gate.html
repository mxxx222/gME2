<!DOCTYPE html>
<html lang="en">
<head>

      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: "Courier New", Courier, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .gate-container {
      max-width: 420px;
      width: 90%;
      padding: 40px 24px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);

    input[type="number"] {

      font-size: 1rem;
      text-align: center;

      align-items: center;

    button#enter {
      padding: 12px 32px;
      font-size: 1rem;
      font-weight: bold;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    button#enter:hover { background: #e0e0e0; }
    button#enter:active { transform: scale(0.98); }

  </div>

  <script>
    document.getElementById("enter").onclick = function() {

      window.location.href = "/?from=gated";

      if (e.key === "Enter") document.getElementById("enter").click();
