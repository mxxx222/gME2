services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gme2_dev
      POSTGRES_USER: gme2_local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - gme2-postgres-data:/var/lib/postgresql/data
      - ./server/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gme2_local -d gme2_dev"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  gme2-postgres-data:
